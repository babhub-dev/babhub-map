<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>밥허브 카카오맵</title>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
    #map { width:100%; height:100%; }
    #error { display:none; padding:20px; color:#c62828; font-size:14px; }
    .recommend-overlay { display:flex; flex-direction:column; align-items:center; transform:translateY(-7px); cursor:pointer; user-select:none; }
    .recommend-people { display:flex; align-items:center; justify-content:center; padding:5px 7px; background:white; border:2px solid #FF7A00; border-radius:25px; box-shadow:0 2px 7px #0003; gap:3px; max-width:150px; }
    .recommend-person { width:28px; height:28px; background:#FFF2E8; color:#FF7A00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:bold; }
    .recommend-more { font-size:12px; font-weight:bold; color:#FF7A00; }
    .recommend-tail { width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:8px solid #FF7A00; }
    .recommend-popup { min-width:180px; max-width:240px; padding:12px; background:#fff; border:1px solid #FF7A00; border-radius:12px; box-shadow:0 3px 12px #0003; font-size:13px; line-height:1.5; }
    .recommend-popup-title { font-weight:bold; color:#222; margin-bottom:7px; }
    .recommend-popup-entry { padding:6px 0; border-top:1px solid #eee; overflow-wrap:anywhere; }
    .recommend-popup-name { font-weight:bold; color:#FF7A00; }
    .recommend-popup-message { color:#444; white-space:pre-wrap; }
    .recommend-popup-close { float:right; background:transparent; border:0; font-size:18px; cursor:pointer; color:#666; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error"></div>
  <!-- 기존에 정상 작동하던 Kakao JavaScript 키를 그대로 유지 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2f35a73f2a362abf560cc7ca7e582092&autoload=false"></script>
  <script>
    let map = null;
    let markers = [];
    let activeInfoWindow = null;
    let restaurantData = [];
    let recommendationData = [];
    let recommendationOverlays = [];
    let activeRecommendationPopup = null;

    function sendMessage(type, message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type, message }));
      }
    }

    function showError(message) {
      document.getElementById("map").style.display = "none";
      const error = document.getElementById("error");
      error.style.display = "block";
      error.textContent = message;
      sendMessage("ERROR", message);
    }

    function clearRecommendationOverlays() {
      if (activeRecommendationPopup) {
        activeRecommendationPopup.setMap(null);
        activeRecommendationPopup = null;
      }
      recommendationOverlays.forEach((overlay) => overlay.setMap(null));
      recommendationOverlays = [];
    }

    function clearMarkers() {
      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }
      clearRecommendationOverlays();
      markers.forEach((marker) => marker.setMap(null));
      markers = [];
    }

    function validCoordinate(restaurant) {
      const latitude = Number(restaurant.latitude);
      const longitude = Number(restaurant.longitude);
      return Number.isFinite(latitude) && Number.isFinite(longitude) &&
        latitude >= -90 && latitude <= 90 && longitude >= -180 && longitude <= 180;
    }

    function showRecommendationPopup(position, restaurant, recommendations) {
      if (activeRecommendationPopup) {
        activeRecommendationPopup.setMap(null);
        activeRecommendationPopup = null;
      }
      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }
      const content = document.createElement("div");
      content.className = "recommend-popup";
      const close = document.createElement("button");
      close.type = "button";
      close.className = "recommend-popup-close";
      close.textContent = "×";
      close.setAttribute("aria-label", "닫기");
      close.addEventListener("click", (event) => {
        event.stopPropagation();
        if (activeRecommendationPopup) {
          activeRecommendationPopup.setMap(null);
          activeRecommendationPopup = null;
        }
      });
      const title = document.createElement("div");
      title.className = "recommend-popup-title";
      title.textContent = String(restaurant.name || "음식점") + " 추천";
      content.appendChild(close);
      content.appendChild(title);
      recommendations.forEach((recommendation) => {
        const entry = document.createElement("div");
        entry.className = "recommend-popup-entry";
        const name = document.createElement("div");
        name.className = "recommend-popup-name";
        name.textContent = String(recommendation.senderNickname || "친구");
        const message = document.createElement("div");
        message.className = "recommend-popup-message";
        message.textContent = recommendation.message || "이 음식점을 추천했어요!";
        entry.appendChild(name);
        entry.appendChild(message);
        content.appendChild(entry);
      });
      activeRecommendationPopup = new kakao.maps.CustomOverlay({
        position,
        content,
        yAnchor: 1.55,
        zIndex: 10,
        clickable: true,
      });
      activeRecommendationPopup.setMap(map);
    }

    function renderRecommendationOverlays() {
      clearRecommendationOverlays();
      if (!map || !Array.isArray(recommendationData)) return;
      const grouped = new Map();
      recommendationData.forEach((recommendation) => {
        const id = String(recommendation.restaurantId);
        if (!grouped.has(id)) grouped.set(id, []);
        grouped.get(id).push(recommendation);
      });
      restaurantData.forEach((restaurant) => {
        if (!validCoordinate(restaurant)) return;
        const recommendations = grouped.get(String(restaurant.id));
        if (!recommendations || recommendations.length === 0) return;
        const position = new kakao.maps.LatLng(Number(restaurant.latitude), Number(restaurant.longitude));
        const root = document.createElement("div");
        root.className = "recommend-overlay";
        root.setAttribute("role", "button");
        root.setAttribute("aria-label", String(restaurant.name || "음식점") + " 추천한 친구 보기");
        root.tabIndex = 0;
        const people = document.createElement("div");
        people.className = "recommend-people";
        // 같은 사용자가 여러 번 추천해도 프로필은 한 번만 표시
        const unique = [...new Map(recommendations.map((r) => [String(r.senderId), r])).values()];
        unique.slice(0, 3).forEach((recommendation) => {
          const person = document.createElement("div");
          person.className = "recommend-person";
          person.textContent = "●";
          person.title = String(recommendation.senderNickname || "친구");
          people.appendChild(person);
        });
        if (unique.length > 3) {
          const more = document.createElement("span");
          more.className = "recommend-more";
          more.textContent = "+" + (unique.length - 3);
          people.appendChild(more);
        }
        const tail = document.createElement("div");
        tail.className = "recommend-tail";
        root.appendChild(people);
        root.appendChild(tail);
        const show = (event) => {
          event.stopPropagation();
          showRecommendationPopup(position, restaurant, recommendations);
        };
        root.addEventListener("click", show);
        root.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            show(event);
          }
        });
        const overlay = new kakao.maps.CustomOverlay({
          position,
          content: root,
          yAnchor: 1.85,
          zIndex: 5,
          clickable: true,
        });
        overlay.setMap(map);
        recommendationOverlays.push(overlay);
      });
    }

    function setRestaurants(restaurants) {
      if (!map || !Array.isArray(restaurants)) return;
      restaurantData = restaurants;
      clearMarkers();
      const bounds = new kakao.maps.LatLngBounds();
      let validCount = 0;
      restaurants.forEach((restaurant) => {
        if (!validCoordinate(restaurant)) return;
        const position = new kakao.maps.LatLng(Number(restaurant.latitude), Number(restaurant.longitude));
        const marker = new kakao.maps.Marker({ position, map });
        const infoContent = document.createElement("div");
        infoContent.style.padding = "10px";
        infoContent.style.minWidth = "160px";
        const name = document.createElement("strong");
        name.textContent = String(restaurant.name || "");
        const address = document.createElement("div");
        address.style.fontSize = "12px";
        address.style.marginTop = "5px";
        address.textContent = String(restaurant.address || "");
        const category = document.createElement("div");
        category.style.fontSize = "12px";
        category.style.color = "#FF7A00";
        category.style.marginTop = "4px";
        category.textContent = String(restaurant.category || "");
        infoContent.appendChild(name);
        infoContent.appendChild(address);
        infoContent.appendChild(category);
        const infoWindow = new kakao.maps.InfoWindow({ content: infoContent, removable: true });
        kakao.maps.event.addListener(marker, "click", () => {
          if (activeInfoWindow) activeInfoWindow.close();
          if (activeRecommendationPopup) {
            activeRecommendationPopup.setMap(null);
            activeRecommendationPopup = null;
          }
          infoWindow.open(map, marker);
          activeInfoWindow = infoWindow;
          sendMessage("MARKER_CLICK", { id: restaurant.id, name: restaurant.name });
        });
        markers.push(marker);
        bounds.extend(position);
        validCount++;
      });
      if (validCount > 0) {
        map.setBounds(bounds);
        if (map.getLevel() < 3) map.setLevel(3);
      }
      renderRecommendationOverlays();
      sendMessage("MARKERS_UPDATED", validCount);
    }

    function setRecommendations(recommendations) {
      if (!Array.isArray(recommendations)) return;
      recommendationData = recommendations;
      renderRecommendationOverlays();
    }

    window.setRestaurants = setRestaurants;
    window.setRecommendations = setRecommendations;

    if (typeof kakao === "undefined" || !kakao.maps) {
      showError("카카오맵 SDK를 불러오지 못했습니다.");
    } else {
      kakao.maps.load(function () {
        try {
          const container = document.getElementById("map");
          map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 4,
          });
          sendMessage("READY", "카카오맵 준비 완료");
        } catch (error) {
          showError("카카오맵 생성 실패: " + error.message);
        }
      });
    }
  </script>
</body>
</html>
