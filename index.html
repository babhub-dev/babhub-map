
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>밥허브 카카오맵</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #error {
      display: none;
      padding: 20px;
      color: #c62828;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="error"></div>

  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2f35a73f2a362abf560cc7ca7e582092&autoload=false">
  </script>

  <script>
    function sendMessage(type, message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({ type, message })
        );
      }
    }

    function showError(message) {
      document.getElementById("map").style.display = "none";
      const error = document.getElementById("error");
      error.style.display = "block";
      error.textContent = message;
      sendMessage("ERROR", message);
    }

    if (typeof kakao === "undefined" || !kakao.maps) {
      showError("카카오맵 SDK를 불러오지 못했습니다.");
    } else {
      kakao.maps.load(function () {
        try {
          const container = document.getElementById("map");

          const options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780),
            level: 4
          };

          const map = new kakao.maps.Map(container, options);

          sendMessage("READY", "카카오맵 로딩 완료");
        } catch (error) {
          showError("지도 생성 실패: " + error.message);
        }
      });
    }
  </script>
</body>
</html>
